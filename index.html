<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Penawaran Gym</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Data Paket Membership 
        const membershipPackages = [
          { id: 'm1', name: '3 Month', price: 1353000, months: 3 },
          { id: 'm2', name: '6 Month', price: 1980000, months: 6 },
          { id: 'm3', name: '12 Month', price: 2618000, months: 12 }, // Harga Bawah
          { id: 'm4', name: '12 Month', price: 2706000, months: 12 }, // Harga Atas
          { id: 'm5', name: '12 Month + 2 Month', price: 3465000, months: 14 },
        ];

        // Data Paket PT 
        const ptPackages = [
          { id: 'pt1', name: 'Paket 3 Session', price: 630000, validity: 19, sessions: 3 },
          { id: 'pt2', name: 'Paket 3 Session', price: 900000, validity: 19, sessions: 3 },
          { id: 'pt3', name: 'Paket 6 Session', price: 1260000, validity: 30, sessions: 6 },
          { id: 'pt4', name: 'Paket 6 Session', price: 1800000, validity: 30, sessions: 6 },
          { id: 'pt5', name: 'Paket 8 Session', price: 1760000, validity: 34, sessions: 8 },
          { id: 'pt6', name: 'Paket 12 Session', price: 2520000, validity: 52, sessions: 12 },
          { id: 'pt7', name: 'Paket 15 Session', price: 3150000, validity: 65, sessions: 15 },
          { id: 'pt8', name: 'Paket 16 Session', price: 3440000, validity: 70, sessions: 16 },
          { id: 'pt9', name: 'Paket 16 Session', price: 3520000, validity: 70, sessions: 16 },
          { id: 'pt10', name: 'Paket 24 Session', price: 4320000, validity: 99, sessions: 24 }, // Bawah
          { id: 'pt11', name: 'Paket 24 Session', price: 5200000, validity: 99, sessions: 24 }, // Atas
          { id: 'pt12', name: 'Paket 32 Session', price: 4960000, validity: 130, sessions: 32 }, // Bawah
          { id: 'pt13', name: 'Paket 32 Session', price: 6880000, validity: 130, sessions: 32 }, // Tengah
          { id: 'pt14', name: 'Paket 32 Session', price: 7040000, validity: 130, sessions: 32 }, // Atas
          { id: 'pt15', name: 'Paket 70 Session', price: 10850000, validity: 290, sessions: 70 },
          { id: 'pt16', name: 'Paket 70 Session', price: 11180000, validity: 290, sessions: 70 },
          { id: 'pt17', name: 'Paket 100 Session', price: 15500000, validity: 410, sessions: 100 },
        ];

        function App() {
          const [includeMembership, setIncludeMembership] = useState(true);
          const [selectedMembershipId, setSelectedMembershipId] = useState(membershipPackages[0].id);

          const [includePT, setIncludePT] = useState(false);
          const [selectedPTId, setSelectedPTId] = useState(ptPackages[0].id);

          const [manualDiscount, setManualDiscount] = useState('');
          const [showDiscount, setShowDiscount] = useState(false);

          // Format Rupiah
          const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
              style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0
            }).format(number);
          };

          const selectedMembership = useMemo(() => 
            membershipPackages.find(p => p.id === selectedMembershipId) || membershipPackages[0],
          [selectedMembershipId]);

          const selectedPT = useMemo(() => 
            ptPackages.find(p => p.id === selectedPTId) || ptPackages[0],
          [selectedPTId]);

          // Kalkulasi Harga Maksimal untuk Gimmick Coret Harga
          const memMaxPrice = useMemo(() => {
            return Math.max(...membershipPackages.filter(p => p.name === selectedMembership.name).map(p => p.price));
          }, [selectedMembership]);

          const ptMaxPrice = useMemo(() => {
            return Math.max(...ptPackages.filter(p => p.name === selectedPT.name).map(p => p.price));
          }, [selectedPT]);

          const memGimmickDiff = includeMembership && (memMaxPrice > selectedMembership.price) ? memMaxPrice - selectedMembership.price : 0;
          const ptGimmickDiff = includePT && (ptMaxPrice > selectedPT.price) ? ptMaxPrice - selectedPT.price : 0;
          const totalAutoDiscount = memGimmickDiff + ptGimmickDiff;

          // Kalkulasi Normal
          const membershipTotal = includeMembership ? selectedMembership.price : 0;
          const ptTotal = includePT ? selectedPT.price : 0;
          const subTotal = membershipTotal + ptTotal;

          const pricePerMonth = membershipTotal > 0 ? (membershipTotal / selectedMembership.months) : 0;
          const pricePerSession = ptTotal > 0 ? (ptTotal / selectedPT.sessions) : 0;

          // Diskon Manual & Total
          const discountValue = parseInt(manualDiscount.replace(/[^0-9]/g, ''), 10) || 0;
          const grandTotal = Math.max(0, subTotal - discountValue);

          // Kalkulasi Breakdown Total Akhir
          let effectiveMonths = 1;
          if (includeMembership) {
            effectiveMonths = selectedMembership.months;
          } else if (includePT) {
            effectiveMonths = Math.max(1, Math.round(selectedPT.validity / 30));
          }
          const grandTotalPerMonth = grandTotal > 0 ? grandTotal / effectiveMonths : 0;

          return (
            <div className="py-8 px-4 flex items-center justify-center">
              <div className="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                
                {/* Header */}
                <div className="bg-indigo-600 p-6 text-white text-center">
                  <div className="flex justify-center mb-3">
                    <i className="fa-solid fa-calculator text-indigo-200 text-4xl"></i>
                  </div>
                  <h1 className="text-2xl font-bold">Kalkulator Biaya Gym</h1>
                  <p className="text-indigo-100 text-sm mt-1">Simulasi Total Penawaran & PT</p>
                </div>

                <div className="p-6 space-y-6">
                  
                  {/* Membership */}
                  <div className="space-y-3">
                    <label className="flex items-center space-x-3 cursor-pointer group">
                      <input type="checkbox" checked={includeMembership} onChange={(e) => setIncludeMembership(e.target.checked)} className="w-5 h-5 text-indigo-600 rounded" />
                      <span className="flex items-center space-x-2 font-semibold text-lg text-slate-700">
                        <i className="fa-solid fa-dumbbell text-indigo-600"></i>
                        <span>Paket Membership</span>
                      </span>
                    </label>

                    {includeMembership && (
                      <div className="pl-8 p-4 bg-slate-50 rounded-xl border border-slate-200 animate-in">
                        <select value={selectedMembershipId} onChange={(e) => setSelectedMembershipId(e.target.value)} className="w-full p-3 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                          {membershipPackages.map(pkg => (
                            <option key={pkg.id} value={pkg.id}>{pkg.name}</option>
                          ))}
                        </select>
                        <div className="mt-3 flex items-center text-sm text-emerald-600 bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100">
                          <i className="fa-solid fa-circle-info mr-2"></i>
                          <span>Jatuhnya hanya <strong>{formatRupiah(pricePerMonth)}</strong> / bulan</span>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Personal Trainer */}
                  <div className="space-y-3">
                    <label className="flex items-center space-x-3 cursor-pointer group">
                      <input type="checkbox" checked={includePT} onChange={(e) => setIncludePT(e.target.checked)} className="w-5 h-5 text-indigo-600 rounded" />
                      <span className="flex items-center space-x-2 font-semibold text-lg text-slate-700">
                        <i className="fa-solid fa-user text-indigo-600"></i>
                        <span>Paket Personal Trainer (PT)</span>
                      </span>
                    </label>

                    {includePT && (
                      <div className="pl-8 p-4 bg-slate-50 rounded-xl border border-slate-200 animate-in">
                        <select value={selectedPTId} onChange={(e) => setSelectedPTId(e.target.value)} className="w-full p-3 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                          {ptPackages.map(pkg => (
                            <option key={pkg.id} value={pkg.id}>{pkg.name}</option>
                          ))}
                        </select>
                        <div className="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                           <div className="flex items-center text-sm text-emerald-600 bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100 flex-1">
                             <i className="fa-solid fa-circle-info mr-2"></i>
                             <span>Jatuhnya hanya <strong>{formatRupiah(pricePerSession)}</strong> / sesi</span>
                           </div>
                           <span className="inline-flex items-center px-2.5 py-2 rounded-lg text-xs font-medium bg-slate-200 text-slate-700">
                             Aktif: {selectedPT.validity} Hari
                           </span>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Diskon Manual */}
                  <div className="pt-4 border-t border-slate-200">
                    <button onClick={() => { setShowDiscount(!showDiscount); if(showDiscount) setManualDiscount(''); }} className="flex items-center justify-between w-full font-semibold text-slate-700 hover:text-indigo-600 focus:outline-none">
                       <div className="flex items-center space-x-2">
                         <i className="fa-solid fa-sliders text-indigo-600"></i>
                         <span>Penyesuaian Harga (Diskon Manual)</span>
                       </div>
                       <i className={`fa-solid ${showDiscount ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                    </button>
                    
                    {showDiscount && (
                      <div className="mt-4 animate-in">
                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">Rp</span>
                          <input type="text" placeholder="0" value={manualDiscount} onChange={(e) => {
                              const val = e.target.value.replace(/[^0-9]/g, '');
                              setManualDiscount(val ? parseInt(val, 10).toLocaleString('id-ID') : '');
                            }} className="w-full pl-10 p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none" />
                        </div>
                        <p className="text-xs text-slate-500 mt-1">*Isi hanya jika ada kesepakatan potongan ekstra</p>
                      </div>
                    )}
                  </div>

                </div>

                {/* Struk / Ringkasan Biaya */}
                <div className="bg-slate-800 text-white p-6 relative overflow-hidden">
                  <i className="fa-solid fa-receipt absolute -right-6 -bottom-6 text-slate-700 opacity-30" style={{fontSize: '120px'}}></i>
                  
                  <div className="relative z-10">
                    <h2 className="text-slate-300 text-sm font-medium uppercase tracking-wider mb-4">Ringkasan Biaya</h2>
                    
                    <div className="space-y-4 mb-4">
                      {includeMembership && (
                        <div className="flex flex-col">
                          <div className="flex justify-between items-center text-sm">
                            <span className="text-slate-300">• Membership: <span className="font-medium text-white">{selectedMembership.name}</span></span>
                            <div className="text-right flex items-center gap-2">
                              {memGimmickDiff > 0 && <span className="text-slate-500 line-through text-xs">{formatRupiah(memMaxPrice)}</span>}
                              <span className="text-white font-medium">{formatRupiah(membershipTotal)}</span>
                            </div>
                          </div>
                          <span className="ml-3 mt-1 text-xs text-emerald-400">(Jatuhnya {formatRupiah(pricePerMonth)} / bulan)</span>
                        </div>
                      )}
                      
                      {includePT && (
                        <div className="flex flex-col">
                          <div className="flex justify-between items-center text-sm">
                            <span className="text-slate-300">• Personal Trainer: <span className="font-medium text-white">{selectedPT.name}</span></span>
                            <div className="text-right flex items-center gap-2">
                              {ptGimmickDiff > 0 && <span className="text-slate-500 line-through text-xs">{formatRupiah(ptMaxPrice)}</span>}
                              <span className="text-white font-medium">{formatRupiah(ptTotal)}</span>
                            </div>
                          </div>
                          <div className="mt-1 ml-3"><span className="inline-block px-2 py-1 bg-slate-700/50 border border-slate-600 rounded text-xs">Masa Aktif: {selectedPT.validity} Hari</span></div>
                        </div>
                      )}

                      {totalAutoDiscount > 0 && (
                        <div className="mt-3 mb-2 p-2 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center text-emerald-400 text-sm font-medium">
                           <i className="fa-solid fa-tag mr-2"></i> Anda Hemat {formatRupiah(totalAutoDiscount)} (Promo Khusus!)
                        </div>
                      )}

                      {discountValue > 0 && (
                        <div className="flex justify-between items-center text-sm text-emerald-400 font-medium mt-4 pt-3 border-t border-slate-700">
                          <span>Potongan Harga Ekstra</span>
                          <span>- {formatRupiah(discountValue)}</span>
                        </div>
                      )}

                      {!includeMembership && !includePT && (
                        <div className="text-slate-400 text-sm italic">Belum ada paket yang dipilih.</div>
                      )}
                    </div>

                    <div className="border-t border-slate-600 pt-4">
                      <div className="flex justify-between items-end">
                        <span className="text-lg font-medium text-slate-200">Total Akhir</span>
                        <div className="text-right">
                          <span className="text-3xl font-bold text-emerald-400 block">{formatRupiah(grandTotal)}</span>
                          {grandTotal > 0 && (
                            <span className="text-sm text-emerald-300/80 mt-1 block font-medium">
                              (Jatuhnya {formatRupiah(grandTotalPerMonth)} / bulan)
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        // Render Aplikasi
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
